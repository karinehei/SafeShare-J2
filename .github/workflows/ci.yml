# SafeShare CI — format, tests, native build, demo smoke, repo self-scan.
# J2 0.1.0 is aarch64-darwin only. Pin macos-26 (hosted Apple Silicon). Do not
# use macos-latest (alias, recently remapped) or macos-*-large (Intel).
# install-j2.sh exits unless uname is Darwin/arm64.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, test, build, smoke, self-scan
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install J2 0.1.0
        # Official release asset + SHA-256 from j2-lang.org/download.html
        # and github.com/JasnamSinghArora/j2/releases/tag/v0.1.0
        # (j2-0.1.0-aarch64-apple-darwin.tar.gz).
        run: |
          chmod +x scripts/ci/install-j2.sh
          ./scripts/ci/install-j2.sh

      - name: Verify j2 --version
        run: |
          j2 --version
          j2 --version | grep -q "0.1.0"

      - name: Format validation
        # j2 0.1.0: `j2 fmt [-w] FILE.j2` — no --check flag
        # (https://j2-lang.org/docs/cli.html). Without -w, fmt writes stdout.
        # CI must not rewrite the tree; fail when stdout ≠ the committed file.
        run: |
          set -euo pipefail
          failed=0
          find . -name '*.j2' ! -path './.git/*' ! -path './tests/lib/*' | LC_ALL=C sort > "${RUNNER_TEMP}/j2-files.txt"
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            tmp=$(mktemp "${RUNNER_TEMP}/fmt.XXXXXX")
            j2 fmt "$f" > "$tmp"
            if ! cmp -s "$f" "$tmp"; then
              echo "unformatted: $f"
              diff -u "$f" "$tmp" || true
              failed=1
            fi
            rm -f "$tmp"
          done < "${RUNNER_TEMP}/j2-files.txt"
          if [ "$failed" -ne 0 ]; then
            echo "Committed .j2 files do not match j2 fmt. Run: j2 fmt -w FILE.j2"
            exit 1
          fi

      - name: Unit and regression tests
        # Interpreter (`j2 run`), not `j2 test`: 0.1.0's test command reports
        # FAIL file.j2 () with no diagnostic on this tree. Tests are pure
        # assert_eq programs (no --allow-fs). Do not pass src/main.j2.
        run: sh scripts/ci/run-tests.sh

      - name: Native build
        run: |
          set -euo pipefail
          if ! j2 build src/main.j2 -o safeshare; then
            echo "native build failed; compiler diagnostics follow"
            J2_DEBUG=1 j2 build src/main.j2 -o "${RUNNER_TEMP}/safeshare-debug" || true
            exit 1
          fi
          test -f ./safeshare
          test -x ./safeshare
          # Capability flags are parsed by `j2`, not by a j2-build binary.
          # --help does not touch fs; missing operands still print usage (exit 2).
          set +e
          ./safeshare --allow-fs --help > "${RUNNER_TEMP}/safeshare-help.txt" 2>&1
          set -e
          grep -q "SafeShare J2" "${RUNNER_TEMP}/safeshare-help.txt"

      - name: Demo-project smoke test
        # Interpreter scan with --allow-fs on j2. J2_FORCE_NATIVE=1 on 0.1.0
        # drops program argv (usage, exit 2). A j2-build binary does not grant fs.
        # --allow-net is never passed. JSON is the deterministic artifact.
        run: |
          set -euo pipefail
          json1="${RUNNER_TEMP}/demo-report-1.json"
          json2="${RUNNER_TEMP}/demo-report-2.json"
          log="${RUNNER_TEMP}/demo-scan.txt"
          demo="demo-project"
          test -d "$demo"

          j2 --allow-fs src/main.j2 scan "$demo" --json "$json1" | tee "$log"
          j2 --allow-fs src/main.j2 scan "$demo" --json "$json2" > /dev/null

          cmp -s "$json1" "$json2"
          python3 scripts/ci/verify-demo-smoke.py "$json1" "$log"

      - name: Self-scan repository
        # Catch accidental real credentials in product sources.
        # Intentional fixtures are listed in .safeshareignore — not by weakening rules.
        run: |
          set -euo pipefail
          json="${RUNNER_TEMP}/self-scan.json"
          j2 --allow-fs src/main.j2 scan . --ai-share --json "$json" | tee "${RUNNER_TEMP}/self-scan.txt"
          python3 scripts/ci/verify-self-scan.py "$json"
